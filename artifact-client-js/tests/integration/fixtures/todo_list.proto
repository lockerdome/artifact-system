syntax = "proto3";

package todo;

import "artifact_options.proto";

message TodoList {
  option (artifact_system.indexes) = {
    key_type: "todo_list_by_name"
    key: ["name"]
    order: { field: "artifact_id" direction: ASCENDING }
    unique: true
  };

  string name = 1;
  string description = 2;
}
