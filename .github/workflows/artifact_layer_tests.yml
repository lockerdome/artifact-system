name: Artifact Layer Tests
on:
  pull_request:
    paths:
      - 'artifact-system/artifact-layer/**'
      - '.github/workflows/artifact_layer_tests.yml'

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    defaults:
      run:
        working-directory: artifact-system/artifact-layer
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential pkg-config curl libssl-dev libcurl4-openssl-dev gcc-14 g++-14 ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-

      - name: Configure
        run: cmake --preset release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset release

      - name: ccache stats
        run: ccache -s

      - name: Test (non-LakeFS)
        run: ctest --preset release -E '^LakeFS/'

      - name: Load LakeFS defaults
        run: |
          set -a
          source dev/lakefs-local/defaults.sh
          set +a
          {
            echo "LAKEFS_ENDPOINT=${LAKEFS_ENDPOINT}"
            echo "LAKEFS_ACCESS_KEY_ID=${LAKEFS_ACCESS_KEY_ID}"
            echo "LAKEFS_SECRET_ACCESS_KEY=${LAKEFS_SECRET_ACCESS_KEY}"
            echo "LAKEFS_STORAGE_NAMESPACE_PREFIX=${LAKEFS_STORAGE_NAMESPACE_PREFIX}"
            echo "LAKEFS_CANONICAL_BRANCH=${LAKEFS_CANONICAL_BRANCH}"
          } >> "$GITHUB_ENV"
      - name: Start LakeFS
        run: make lakefs-up
      - name: Test (LakeFS conformance)
        run: ctest --preset release -R '^LakeFS/'
      - name: LakeFS logs on failure
        if: failure()
        run: docker logs artifact-layer-lakefs || true
      - name: Stop LakeFS
        if: always()
        run: make lakefs-down
