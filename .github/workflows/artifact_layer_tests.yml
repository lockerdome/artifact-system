name: Artifact Layer Tests
on:
  pull_request:
    paths:
      - 'artifact-system/artifact-layer/**'
      - '.github/workflows/artifact_layer_tests.yml'

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        working-directory: artifact-system/artifact-layer
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential pkg-config libssl-dev gcc-14 g++-14
      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: artifact-system/artifact-layer/build/release/_deps
          key: ${{ runner.os }}-artifact-layer-${{ hashFiles('artifact-system/artifact-layer/CMakeLists.txt', 'artifact-system/artifact-layer/cmake/dependencies.cmake', 'artifact-system/artifact-layer/CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-artifact-layer-
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
